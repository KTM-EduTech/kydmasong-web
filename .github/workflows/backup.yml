# Weekly database backup (Supabase's free plan has no automatic backups).
# Requires repository secret SUPABASE_DB_URL: Supabase > Project Settings > Database >
# Connection string (Session pooler, URI format, with your database password).
# Backups are kept as workflow artifacts for 90 days; download them from the Actions tab.
name: Weekly database backup
on:
  schedule:
    - cron: "41 20 * * 0" # Sundays, 03:41 Monday Bangkok time
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" --data-only -f backup/data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: kydmasong-db-${{ github.run_id }}
          path: backup/
          retention-days: 90

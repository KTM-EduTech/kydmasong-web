# Keeps the free Supabase project active (free projects pause after 7 days without activity).
# Requires repository secrets: SITE_URL (e.g. https://www.kydmasong.net) and CRON_SECRET.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 * * *" # daily, 10:17 Bangkok time
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/keepalive
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/keepalive")
          echo "HTTP $code"
          test "$code" = "200"
